# Go Vulnerability Scanning (govulncheck)
name: Security - Go Vulnerability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'  # Daily at 7 AM UTC

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          # Find all Go modules in the workspace
          find . -name "go.mod" -type f | while read mod; do
            dir=$(dirname "$mod")
            echo "Checking $dir"
            (cd "$dir" && govulncheck ./...) || echo "Vulnerabilities found in $dir"
          done