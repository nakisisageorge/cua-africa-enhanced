# SBOM Generation - CycloneDX
name: SBOM Generation

on:
  push:
    branches: [main]
    tags: ['cua-mcp-v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: cargo-cyclonedx

      - name: Generate SBOM (workspace)
        run: cargo cyclonedx --workspace --output-target sbom-workspace.json

      - name: Generate SBOM (cua-mcp)
        run: cargo cyclonedx -p cua-mcp --output-target sbom-cua-mcp.json

      - name: Generate SBOM (cua-bench-regression)
        run: cargo cyclonedx -p cua-bench-regression --output-target sbom-cua-bench-regression.json

      - name: Validate SBOMs
        run: |
          for f in sbom-*.json; do
            if ! jq empty "$f" 2>/dev/null; then
              echo "Invalid JSON: $f"
              exit 1
            fi
            # Check required CycloneDX fields
            jq -e '.bomFormat == "CycloneDX" and .specVersion' "$f" > /dev/null || {
              echo "Invalid CycloneDX format: $f"
              exit 1
            }
          done
          echo "All SBOMs valid"

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom-*.json
          retention-days: 90

      - name: Attach SBOM to release
        if: startsWith(github.ref, 'refs/tags/cua-mcp-v')
        uses: softprops/action-gh-release@v1
        with:
          files: sbom-cua-mcp.json